<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Top Navigation (Suppressed per rules for transactional/login pages, but keeping a minimal brand header) -->
<header class="bg-surface-container-lowest text-primary px-lg h-16 w-full flex items-center shadow-sm z-50">
<div class="max-w-container-max mx-auto w-full flex justify-center items-center">
<span class="font-headline-lg text-headline-lg text-primary">PharmaCare</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-md md:p-xl relative overflow-hidden">
<!-- Subtle Background Decorative Element -->
<div class="absolute inset-0 z-0 flex items-center justify-center opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[400px] text-primary" style="font-variation-settings: 'FILL' 0;">local_pharmacy</span>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-surface-variant w-full max-w-[440px] p-xl z-10 relative">
<div class="text-center mb-lg">
<span class="material-symbols-outlined text-primary text-[48px] mb-sm" style="font-variation-settings: 'FILL' 1;">badge</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Staff Portal</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to access pharmacy operations.</p>
</div>
<form class="space-y-lg">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email Address / Employee ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-DEFAULT pl-[40px] pr-sm py-sm font-body-md text-body-md text-on-surface transition-colors" id="email" name="email" placeholder="e.g. jdoe@pharmacare.com" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 rounded-t-DEFAULT pl-[40px] pr-[40px] py-sm font-body-md text-body-md text-on-surface transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-sm flex items-center cursor-pointer">
<span class="material-symbols-outlined text-outline hover:text-on-surface-variant transition-colors">visibility_off</span>
</div>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between pt-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-sm block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-tertiary hover:text-tertiary-container transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center py-sm px-md border border-transparent rounded-lg shadow-sm font-title-md text-title-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors min-h-[44px]" type="submit">
<span class="material-symbols-outlined mr-sm">login</span>
                    Login as Staff
                </button>
</form>
<!-- Footer Note -->
<div class="mt-xl text-center">
<div class="flex items-center justify-center gap-xs text-error">
<span class="material-symbols-outlined text-[16px]">security</span>
<p class="font-label-md text-label-md uppercase tracking-wider">Authorized pharmacy staff only</p>
</div>
</div>
</div>
</main>
</body></html>
