      PORT: "8005"
      USER_SERVICE_URL: http://pharmacare-user-service:8001
    ports:
      - "8005:8005"
    command: python manage.py runserver 0.0.0.0:8005
    networks:
      - pharmacare_backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  chatbot_service:
    build:
      context: ./services/chatbot_service
    container_name: pharmacare-chatbot-service
    environment:
      DJANGO_SECRET_KEY: chatbot_service-dev-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,pharmacare-chatbot-service
      PORT: "8006"
      CHATBOT_ARTIFACT_DIR: artifacts
    ports:
      - "8006:8006"
    command: python manage.py runserver 0.0.0.0:8006
    networks:
      - pharmacare_backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health/').read()"]
